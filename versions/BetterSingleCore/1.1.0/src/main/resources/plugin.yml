name: BetterSingleCore
version: 1.1.0
main: com.bettersinglecore.BetterSingleCorePlugin
api-version: '1.21'
description: Multi-core offload for Minecraft — parallel chunk IO / path warmup across worker threads (no AI dormancy).
author: BetterSingleCore
website: https://github.com/local/better-single-core
commands:
  bsc:
    description: BetterSingleCore diagnostics and control
    usage: /bsc <status|reload|enable|disable|workers|preload>
    permission: bettersinglecore.admin
    aliases: [singlecore, sc]
permissions:
  bettersinglecore.admin:
    description: Admin access to BetterSingleCore
    default: op
