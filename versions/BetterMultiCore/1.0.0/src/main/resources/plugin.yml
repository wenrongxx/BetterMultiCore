name: BetterMultiCore
version: 1.0.0
main: com.bettermulticore.BetterMultiCorePlugin
api-version: '1.21'
description: Multi-core spread + parallel particle + lighter pathwarm scans + PlugMan hot unload (no AI dormancy).
author: BetterMultiCore
website: https://github.com/wenrongxx/BetterMultiCore
commands:
  bmc:
    description: BetterMultiCore diagnostics and control
    usage: /bmc <status|reload|enable|disable|workers|preload|pathwarm|monitor|particle|adaptive>
    permission: bettermulticore.admin
    aliases: [multicore]
permissions:
  bettermulticore.admin:
    description: Admin access to BetterMultiCore
    default: op
